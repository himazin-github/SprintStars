<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#111112">
  <link rel="manifest" href="manifest.json">
  <title>Speed Stars</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #111112;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: none;
      position: fixed;
      inset: 0;
    }
    #game-wrapper {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111112;
    }
    #unity-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #unity-canvas {
      width: 100%;
      height: 100%;
      max-width: 100vw;
      max-height: 100vh;
      max-height: 100dvh;
      aspect-ratio: 16 / 9;
      background: #231F20;
      display: block;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
      outline: none;
      touch-action: none;
    }
    /* Loading overlay */
    #loading-cover {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #252224 0%, #111011 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      transition: opacity 0.4s ease-out;
      padding: 20px;
    }
    .game-logo {
      font-size: clamp(2rem, 6vw, 4rem);
      font-weight: 900;
      font-style: italic;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: linear-gradient(90deg, #ffcc00, #ff3366, #33ccff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
      filter: drop-shadow(0 0 20px rgba(255, 100, 100, 0.35));
      text-align: center;
    }
    .game-subtitle {
      font-size: clamp(0.75rem, 2.5vw, 0.95rem);
      color: #999;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 28px;
      font-weight: 500;
      text-align: center;
    }
    .progress-box {
      width: min(360px, 80vw);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .progress-bar-bg {
      width: 100%;
      height: 10px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 6px;
      overflow: hidden;
      position: relative;
    }
    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #33ccff, #ff3366);
      border-radius: 6px;
      transition: width 0.15s ease;
      box-shadow: 0 0 12px rgba(51, 204, 255, 0.6);
    }
    .progress-status {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: #bbb;
      font-weight: 600;
    }
    /* Controls hint */
    .controls-hint {
      margin-top: 26px;
      padding: 10px 18px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 0.8rem;
      color: #ddd;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 90vw;
    }
    .key-badge {
      background: #2a2a2e;
      border: 1px solid #555;
      border-radius: 4px;
      padding: 2px 7px;
      font-weight: bold;
      color: #fff;
      font-size: 0.75rem;
    }

    /* Tap to Start / Fullscreen overlay (for mobile gesture triggers) */
    #start-overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 90;
      cursor: pointer;
    }
    .start-button {
      padding: 16px 36px;
      font-size: 1.3rem;
      font-weight: bold;
      color: #fff;
      background: linear-gradient(135deg, #ff3366, #ff8800);
      border: none;
      border-radius: 50px;
      box-shadow: 0 0 25px rgba(255, 51, 102, 0.6);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      animation: pulse 1.8s infinite ease-in-out;
      letter-spacing: 1px;
    }
    .start-tip {
      margin-top: 14px;
      font-size: 0.85rem;
      color: #bbb;
      text-align: center;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 20px rgba(255, 51, 102, 0.5); }
      50% { transform: scale(1.05); box-shadow: 0 0 35px rgba(255, 51, 102, 0.85); }
    }

    /* Fullscreen Button */
    #fullscreen-btn {
      position: absolute;
      bottom: max(12px, env(safe-area-inset-bottom, 12px));
      right: max(12px, env(safe-area-inset-right, 12px));
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 20px;
      color: #eee;
      padding: 8px 14px;
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      z-index: 50;
      opacity: 0.75;
      transition: opacity 0.2s, background 0.2s, transform 0.15s;
    }
    #fullscreen-btn:hover {
      opacity: 1;
      background: rgba(0, 0, 0, 0.85);
    }
    #fullscreen-btn:active {
      transform: scale(0.95);
    }

    /* Rotate Prompt for mobile portrait */
    #rotate-prompt {
      display: none;
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      background: #111112;
      z-index: 9999;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 24px;
    }
    .phone-icon {
      width: 50px;
      height: 80px;
      border: 3px solid #ff3366;
      border-radius: 12px;
      margin-bottom: 24px;
      position: relative;
      animation: rotatePhone 2.2s infinite ease-in-out;
    }
    .phone-icon::after {
      content: '';
      position: absolute;
      top: 6px;
      left: 50%;
      transform: translateX(-50%);
      width: 16px;
      height: 3px;
      background: #ff3366;
      border-radius: 2px;
    }
    @keyframes rotatePhone {
      0%, 15% { transform: rotate(0deg); }
      50%, 65% { transform: rotate(-90deg); }
      100% { transform: rotate(0deg); }
    }
    .rotate-text {
      font-size: 1.1rem;
      font-weight: bold;
      color: #fff;
      margin-bottom: 6px;
    }
    .rotate-sub {
      font-size: 0.85rem;
      color: #888;
    }

    /* Show rotate prompt on mobile when in portrait */
    @media screen and (orientation: portrait) and (max-width: 900px) {
      #rotate-prompt {
        display: flex;
      }
    }
  </style>
</head>
<body>
  <!-- Device Orientation Prompt for Mobile -->
  <div id="rotate-prompt">
    <div class="phone-icon"></div>
    <div class="rotate-text">画面を横向きにしてください</div>
    <div class="rotate-sub">Please rotate your device for the best experience</div>
  </div>

  <div id="game-wrapper">
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
    </div>

    <!-- Loading Screen -->
    <div id="loading-cover">
      <div class="game-logo">SPEED STARS</div>
      <div class="game-subtitle">Ad-Free Lightweight Edition</div>
      <div class="progress-box">
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progress-fill"></div>
        </div>
        <div class="progress-status">
          <span id="loading-label">Loading Game...</span>
          <span id="progress-percent">0%</span>
        </div>
      </div>
      <div class="controls-hint">
        <span>Controls:</span>
        <span class="key-badge">◀</span>
        <span class="key-badge">▶</span>
        <span>or</span>
        <span class="key-badge">A</span>
        <span class="key-badge">D</span>
        <span>(Mobile: Tap screen left/right)</span>
      </div>
    </div>

    <!-- Start / Fullscreen Trigger Overlay for Mobile -->
    <div id="start-overlay">
      <button class="start-button" id="start-btn">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="5 3 19 12 5 21 5 3"/>
        </svg>
        <span>TAP TO PLAY</span>
      </button>
      <div class="start-tip">タップしてフルスクリーンで開始</div>
    </div>

    <!-- Fullscreen Button -->
    <button id="fullscreen-btn" title="Toggle Fullscreen">
      <svg id="fs-icon-enter" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
      </svg>
      <svg id="fs-icon-exit" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
        <path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/>
      </svg>
      <span id="fs-btn-text">全画面</span>
    </button>
  </div>

  <script>
    // --- 1. Completely Ad-Free, Offline Poki SDK Mock ---
    const noop = () => {};
    const resolvePromise = (val) => Promise.resolve(val);

    window.PokiSDK = {
      init: () => resolvePromise(),
      initWithVideoHB: () => resolvePromise(),
      customEvent: noop,
      commercialBreak: () => resolvePromise(),
      rewardedBreak: () => resolvePromise(true), // Automatically grant reward without ads
      displayAd: noop,
      destroyAd: noop,
      getLeaderboard: () => resolvePromise([]),
      getSharableURL: () => resolvePromise(window.location.href),
      shareableURL: () => resolvePromise(window.location.href),
      getURLParam: () => "",
      getLanguage: () => (navigator.language || "en").substring(0, 2),
      isAdBlocked: () => false,
      disableProgrammatic: noop,
      gameLoadingStart: noop,
      gameLoadingFinished: noop,
      gameLoadingProgress: noop,
      gameInteractive: noop,
      roundStart: noop,
      roundEnd: noop,
      muteAd: noop,
      setDebug: noop,
      gameplayStart: noop,
      gameplayStop: noop,
      happyTime: noop,
      setPlayerAge: noop,
      togglePlayerAdvertisingConsent: noop,
      logError: noop,
      sendHighscore: noop,
      setDebugTouchOverlayController: noop
    };

    // --- 2. Poki Bridge Mock for Unity C# ---
    let pokiBridgeName = null;

    window.initPokiBridge = function(bridgeName) {
      pokiBridgeName = bridgeName;
      if (window.unityGame) {
        try {
          window.unityGame.SendMessage(bridgeName, "ready");
        } catch (e) {
          console.warn("initPokiBridge send ready failed:", e);
        }
      }
    };

    window.commercialBreak = function() {
      if (pokiBridgeName && window.unityGame) {
        window.unityGame.SendMessage(pokiBridgeName, "commercialBreakCompleted");
      }
    };

    window.rewardedBreak = function() {
      if (pokiBridgeName && window.unityGame) {
        // "true" indicates the user received the reward
        window.unityGame.SendMessage(pokiBridgeName, "rewardedBreakCompleted", "true");
      }
    };

    window.shareableURL = function(url) {
      if (pokiBridgeName && window.unityGame) {
        window.unityGame.SendMessage(pokiBridgeName, "shareableURLResolved", url || window.location.href);
      }
    };

    // --- 3. Fullscreen & Orientation Helper ---
    const isMobile = /Android|iPhone|iPad|iPod|webOS|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || (navigator.maxTouchPoints && navigator.maxTouchPoints > 2);

    function enterFullscreen() {
      const docEl = document.documentElement;
      const requestMethod = docEl.requestFullscreen || docEl.webkitRequestFullscreen || docEl.mozRequestFullScreen || docEl.msRequestFullscreen;

      if (requestMethod) {
        requestMethod.call(docEl).catch(() => {});
      }

      // Try locking screen to landscape on Android Chrome
      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock("landscape").catch(() => {});
      }

      // Hide iOS address bar
      window.scrollTo(0, 1);
    }

    function exitFullscreen() {
      const exitMethod = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen;
      if (exitMethod) {
        exitMethod.call(document).catch(() => {});
      }
      if (screen.orientation && screen.orientation.unlock) {
        screen.orientation.unlock();
      }
    }

    function isFullscreenActive() {
      return !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement);
    }

    function updateFullscreenUI() {
      const active = isFullscreenActive();
      const iconEnter = document.querySelector("#fs-icon-enter");
      const iconExit = document.querySelector("#fs-icon-exit");
      const btnText = document.querySelector("#fs-btn-text");

      if (active) {
        iconEnter.style.display = "none";
        iconExit.style.display = "block";
        btnText.textContent = "縮小";
      } else {
        iconEnter.style.display = "block";
        iconExit.style.display = "none";
        btnText.textContent = "全画面";
      }
    }

    document.addEventListener("fullscreenchange", updateFullscreenUI);
    document.addEventListener("webkitfullscreenchange", updateFullscreenUI);

    // --- 4. Unity WebGL Loader ---
    const canvas = document.querySelector("#unity-canvas");
    const loadingCover = document.querySelector("#loading-cover");
    const progressFill = document.querySelector("#progress-fill");
    const progressPercent = document.querySelector("#progress-percent");
    const loadingLabel = document.querySelector("#loading-label");
    const fullscreenBtn = document.querySelector("#fullscreen-btn");
    const startOverlay = document.querySelector("#start-overlay");

    const buildUrl = "Build";
    const config = {
      dataUrl: buildUrl + "/6127fbba3e79cbcada24ba1ffd033f77.data",
      frameworkUrl: buildUrl + "/b0e5ec181474d494c6ff3c9ad9c3b1bd.js",
      codeUrl: buildUrl + "/fe2a5824416bebe1cc941510618103f9.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Luke Doukakis",
      productName: "Speed Stars",
      productVersion: "2.40",
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)
    };

    const loaderScript = document.createElement("script");
    loaderScript.src = buildUrl + "/Build_v2-40w.loader.js";
    loaderScript.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        const pct = Math.min(100, Math.round(progress * 100));
        progressFill.style.width = pct + "%";
        progressPercent.textContent = pct + "%";
        if (progress >= 1) {
          loadingLabel.textContent = "Starting game...";
        }
      }).then((instance) => {
        window.unityGame = instance;
        loadingCover.style.opacity = "0";
        setTimeout(() => {
          loadingCover.style.display = "none";
        }, 400);

        if (pokiBridgeName) {
          instance.SendMessage(pokiBridgeName, "ready");
        }

        // On mobile, show Start overlay to trigger fullscreen on first user touch
        if (isMobile) {
          startOverlay.style.display = "flex";
        } else {
          canvas.focus();
        }
      }).catch((err) => {
        console.error("Unity load failed:", err);
        loadingLabel.textContent = "Loading error: " + err;
      });
    };
    document.body.appendChild(loaderScript);

    // Start button (Tap to Play) event
    function handleStart(e) {
      if (e) e.preventDefault();
      enterFullscreen();
      startOverlay.style.display = "none";
      canvas.focus();
    }
    startOverlay.addEventListener("click", handleStart);
    startOverlay.addEventListener("touchstart", handleStart, { passive: false });

    // Fullscreen button event
    fullscreenBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      if (!isFullscreenActive()) {
        enterFullscreen();
      } else {
        exitFullscreen();
      }
    });

    // Auto-focus canvas on any tap
    window.addEventListener("click", () => {
      if (document.activeElement !== canvas && startOverlay.style.display !== "flex") {
        canvas.focus();
      }
    });

    // Prevent default scroll behavior on touch devices
    document.addEventListener("touchmove", (e) => {
      e.preventDefault();
    }, { passive: false });
  </script>
</body>
</html>
